[project]
name = "icops"
version = "0.1.0"
description = "智工云枢（ICOPS）MVP - Intelligent Construction Operation Platform backend & data pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "Faker>=24",
    "python-docx>=1.1",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[project.optional-dependencies]
# 完整模式：Chroma 向量库（离线演示模式可不用，自动降级为内置向量存储）
vector = ["chromadb>=0.5"]
# Agent 微调（SFT）：8GB 显存可跑 Qwen2.5-1.5B 的 4-bit QLoRA。
# 安装（torch 走官方 CUDA 源，避免拿到 CPU-only 包）：
#   uv pip install torch --index-url https://download.pytorch.org/whl/cu126
#   uv pip install --extra train
# 国内网络：export HF_ENDPOINT=https://hf-mirror.com（直连 huggingface.co 常不可达）
train = [
    "transformers>=4.57",
    "peft>=0.14",
    "datasets>=3.0",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
]

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# B008：FastAPI 依赖注入（Depends(...) 作参数默认值）为框架惯用法，予以忽略
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"backend/app/core/config.py" = []
"scripts/*.py" = ["E402"]
"backend/tests/*.py" = ["E402"]
